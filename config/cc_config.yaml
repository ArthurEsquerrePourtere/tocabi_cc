# Custom Controller Configuration
# Based on rl_cc.hpp/cpp structure

# ONNX Model Paths (relative to package share directory's onnx/ folder or absolute paths)
models:
  actor: "/home/rui/rui_ws/erfi_ws/AMP_framework/logs/onnx/actor.onnx"
  normalizer: "/home/rui/rui_ws/erfi_ws/AMP_framework/logs/onnx/normalizer.onnx"
  denormalizer: "/home/rui/rui_ws/erfi_ws/AMP_framework/logs/onnx/denormalizer.onnx"
  decoder: "/home/rui/rui_ws/erfi_ws/AMP_framework/logs/onnx/decoder.onnx"
  critic: "/home/rui/rui_ws/erfi_ws/AMP_framework/logs/onnx/critic.onnx"

# Data Output Configuration
data_output:
  enabled: true
  output_dir: "result"  # Relative to package share directory, or use absolute path
  filename_prefix: "data"
  save_frequency: 100  # Save data every N iterations

# Command Speed Configuration
commands:
  joy_enabled: true  # Enable joystick command input
  target_vel_x: 0.5      # Target velocity in x direction (m/s) - used when joy_enabled is false
  target_vel_y: 0.0      # Target velocity in y direction (m/s)
  target_vel_yaw: 0.0    # Target yaw velocity (rad/s)

  heading: false
  target_heading: 0.0    # Target heading angle (rad)

# Controller Settings
controller:
  control_frequency: 2000  # Hz - Main control loop frequency (pd_hz_)
  inference_frequency: 125.0  # Hz - Neural network inference frequency
  action_type: "T"  # "T" for torque control, "P" for position control
  is_on_robot: false  # true for real robot, false for simulation
  ctrl_mode: 0  # 0 for joystick control, 1 for file-based commands

# Debug Settings
debug:
  enable_debug_prints: true
  enable_torque_debug_prints: false
  print_frequency: 100  # Print debug info every N iterations

# Model Inference Settings
inference:
  use_deterministic: true
  optimization_level: 0  # 0: ORT_DISABLE_ALL, 3: ORT_ENABLE_ALL

# Controller Parameters
params:
  # Torque bounds for each joint (N·m)
  torque_bound: [333.0, 232.0, 263.0, 289.0, 222.0, 166.0,   # Left leg (6)
                 333.0, 232.0, 263.0, 289.0, 222.0, 166.0,   # Right leg (6)
                 303.0, 303.0, 303.0,                        # Waist (3)
                 64.0, 64.0, 64.0, 64.0, 23.0, 23.0, 10.0, 10.0,  # Left arm (8)
                 10.0, 10.0,                                 # Neck (2)
                 64.0, 64.0, 64.0, 64.0, 23.0, 23.0, 10.0, 10.0]  # Right arm (8)

  # PD gains (diagonal values)
  kp_diagonal: [2000.0, 5000.0, 4000.0, 3700.0, 3200.0, 3200.0,  # Left leg
                2000.0, 5000.0, 4000.0, 3700.0, 3200.0, 3200.0,  # Right leg
                6000.0, 10000.0, 10000.0,                        # Waist
                400.0, 1000.0, 400.0, 400.0, 400.0, 400.0, 100.0, 100.0,  # Left arm
                100.0, 100.0,                                    # Neck
                400.0, 1000.0, 400.0, 400.0, 400.0, 400.0, 100.0, 100.0]  # Right arm

  kv_diagonal: [15.0, 50.0, 20.0, 25.0, 24.0, 24.0,      # Left leg
                15.0, 50.0, 20.0, 25.0, 24.0, 24.0,      # Right leg
                200.0, 100.0, 100.0,                     # Waist
                10.0, 28.0, 10.0, 10.0, 10.0, 10.0, 3.0, 3.0,  # Left arm
                2.0, 2.0,                                # Neck
                10.0, 28.0, 10.0, 10.0, 10.0, 10.0, 3.0, 3.0]  # Right arm

  # PD gains scale factor (kp_diagonal will be DIVIDED by this value)
  kp_scale: 9.0
  kv_scale: 3.0

  # Initial joint positions (rad)
  q_init: [0.0, 0.0, -0.24, 0.6, -0.36, 0.0,      # Left leg
           0.0, 0.0, -0.24, 0.6, -0.36, 0.0,      # Right leg
           0.0, 0.0, 0.0,                         # Waist
           0.3, 0.3, 1.5, -1.27, -1.0, 0.0, -1.0, 0.0,  # Left arm
           0.0, 0.0,                              # Neck
           -0.3, -0.3, -1.5, 1.27, 1.0, 0.0, 1.0, 0.0]  # Right arm

  # PD limits [lower, upper] for each joint (only 12 actuated leg joints)
  pd_limit:
    - [-0.6, 0.8]    # Joint 0
    - [-1.0, 1.0]    # Joint 1
    - [-1.0, 1.0]    # Joint 2
    - [-0.3, 1.5]    # Joint 3
    - [-1.0, 1.0]    # Joint 4
    - [-1.0, 1.0]    # Joint 5
    - [-0.8, 0.6]    # Joint 6
    - [-1.0, 1.0]    # Joint 7
    - [-1.0, 1.0]    # Joint 8
    - [-0.3, 1.5]    # Joint 9
    - [-1.0, 1.0]    # Joint 10
    - [-1.0, 1.0]    # Joint 11

# Joystick velocity scaling
joystick:
  vel_scale_x: 0.6
  vel_scale_y: 0.2

# Walking parameters
walking:
  step_period: 0.8
  max_stride_x: 0.4
  max_stride_y: 0.12
  max_stride_yaw: 0.4
